{% extends "base.html" %}
{% block title %}EdTech — Курсы{% endblock %}

{% block content %}
<h1>Курсы</h1>

<form class="inline-form glass" onsubmit="createCourse(event)">
  <input name="name" placeholder="Название" required />
  <input name="price" type="number" min="0" step="0.01" placeholder="Цена ₽" required />
  <input name="duration" type="number" min="1" placeholder="Часы" required />
  <select name="teacherId">
    <option value="">Без преподавателя</option>
    {% for t in teachers %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}
  </select>
  <button type="submit">Добавить</button>
</form>

<table class="glass">
  <tr><th>ID</th><th>Название</th><th>Цена ₽</th><th>Часы</th><th>Студентов</th><th></th></tr>
  {% for c in courses %}
  <tr>
    <td>{{ c.id }}</td>
    <td>{{ c.name }}</td>
    <td>{{ c.price }}</td>
    <td>{{ c.duration }}</td>
    <td>{{ c.students|length }}</td>
    <td><button onclick="deleteCourse({{ c.id }})">Удалить</button></td>
  </tr>
  {% else %}
  <tr><td colspan="6">Курсов пока нет</td></tr>
  {% endfor %}
</table>

<script>
function createCourse(event) {
  event.preventDefault();
  const form = event.target;
  fetch("/courses/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name: form.name.value,
      price: Number(form.price.value),
      duration: Number(form.duration.value)
    })
  }).then(r => r.ok ? location.reload() : alert("Ошибка создания курса"));
}

function deleteCourse(courseId) {
  fetch(`/courses/${courseId}`, { method: "DELETE" })
    .then(r => r.status === 204 ? location.reload() : alert("Не удалось удалить курс"));
}
</script>
{% endblock %}
